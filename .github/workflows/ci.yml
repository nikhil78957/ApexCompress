name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ Binary
        run: cmake --build build --config Release

      - name: Run Python Reference Tests
        run: |
          python tests/generate_test_data.py
          python tests/benchmark_comparison.py

      - name: Verify Round-Trip Integrity
        run: |
          python apex_compress.py -t benchmark_data/sample_patterns.bin
          python apex_compress.py -t benchmark_data/sample_code.json
          python apex_compress.py -t benchmark_data/sample_text.txt
